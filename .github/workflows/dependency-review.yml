name: Dependency review

on:
  pull_request:
  # Lance par le snapshot du classement sur sa branche (voir snapshot-classement.yml).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Bloquer les pull requests qui ajoutent une dépendance vulnérable
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
          # Hors pull_request, l'action doit recevoir les deux references.
          base-ref: ${{ github.event.pull_request.base.sha || 'main' }}
          head-ref: ${{ github.event.pull_request.head.sha || github.sha }}
