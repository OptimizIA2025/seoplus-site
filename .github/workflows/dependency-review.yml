name: Dependency review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Bloquer les pull requests qui ajoutent une dépendance vulnérable
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
