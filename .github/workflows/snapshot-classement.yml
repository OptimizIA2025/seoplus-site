name: Snapshot du classement

# Chaque nuit, fige dans le HTML le classement public et le compteur d'analyses
# (leaderboard.html, index.html) : GPTBot, ClaudeBot et PerplexityBot
# n'executent pas JavaScript et ne voient que cette copie. Si rien n'a change,
# rien ne se passe. Sinon : l'image est construite et verifiee comme dans la CI,
# puis le commit part directement sur main, ce qui declenche Coolify.
#
# Pas de pull request : celles ouvertes par le GITHUB_TOKEN lancent des
# controles qui attendent une approbation manuelle (action_required), la fusion
# automatique ne partait donc jamais seule (echecs des 28, 29 et 30/09). Le push
# passe par la cle de deploiement en ecriture SNAPSHOT_DEPLOY_KEY, que le
# ruleset de main laisse passer comme toute cle de deploiement. L'autre cle du
# depot, celle de Coolify, est en lecture seule : n'ajouter aucune cle en
# ecriture sans se souvenir qu'elle contournerait aussi le ruleset.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: snapshot-classement
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ssh-key: ${{ secrets.SNAPSHOT_DEPLOY_KEY }}

      # Les dates du snapshot suivent l'heure de Paris, comme le site.
      - name: Regenerer le snapshot
        run: node scripts/generer-snapshot-classement.js --go
        env:
          TZ: Europe/Paris

      - name: Detecter un changement
        id: diff
        run: |
          if git diff --quiet; then
            echo "Classement inchange, rien a publier." >> "$GITHUB_STEP_SUMMARY"
            echo "change=false" >> "$GITHUB_OUTPUT"
          else
            echo "change=true" >> "$GITHUB_OUTPUT"
          fi

      # Meme filet que le job image de la CI, que ce push ne passe pas :
      # rien ne part en production sans lui.
      - name: Construire et verifier l'image
        if: steps.diff.outputs.change == 'true'
        run: |
          docker build -t site .
          docker run --rm site nginx -t
          docker run -d --name site -p 8080:80 site
          sleep 3
          bash scripts/verifier-image.sh
          docker rm -f site

      - name: Publier sur main
        if: steps.diff.outputs.change == 'true'
        run: |
          jour=$(TZ=Europe/Paris date +%d/%m/%Y)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Snapshot du classement du $jour"
          git push origin HEAD:main
          echo "Publie sur main : $(git rev-parse --short HEAD), deploiement Coolify en cours." >> "$GITHUB_STEP_SUMMARY"
