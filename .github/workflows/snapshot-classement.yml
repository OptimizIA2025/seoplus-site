name: Snapshot du classement

# Chaque nuit, fige dans le HTML le classement public et le compteur d'analyses
# (leaderboard.html, index.html) : GPTBot, ClaudeBot et PerplexityBot
# n'executent pas JavaScript et ne voient que cette copie. Si rien n'a change,
# rien ne se passe. Sinon : branche, pull request, fusion automatique une fois
# les verifications requises du ruleset passees, puis deploiement Coolify comme
# toute fusion sur main.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: snapshot-classement
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Les dates du snapshot suivent l'heure de Paris, comme le site.
      - name: Regenerer le snapshot
        run: node scripts/generer-snapshot-classement.js --go
        env:
          TZ: Europe/Paris

      - name: Publier par pull request si le classement a change
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "Classement inchange, rien a publier." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          jour=$(TZ=Europe/Paris date +%d/%m/%Y)
          # Une seule branche : un passage qui a echoue est repris et ecrase par
          # le suivant, au lieu de laisser une branche orpheline par nuit.
          branche="snapshot/classement"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branche"
          git commit -am "Snapshot du classement du $jour"
          git push --force origin "$branche"
          url=$(gh pr list --head "$branche" --state open --json url --jq '.[0].url')
          if [ -n "$url" ]; then
            gh pr edit "$url" --title "Snapshot du classement du $jour"
          else
            url=$(gh pr create --base main --head "$branche" \
              --title "Snapshot du classement du $jour" \
              --body "Classement public et compteur d'analyses figes dans le HTML par le workflow de nuit. Fusion automatique apres les verifications requises.")
          fi
          gh pr merge --auto --squash --delete-branch "$url"
          # Le job attend la fusion : une pull request restee bloquee (controle
          # rouge, execution en attente d'approbation) fait echouer le workflow,
          # donc un e-mail de GitHub, au lieu d'un classement qui vieillit en silence.
          for i in $(seq 1 40); do
            if [ "$(gh pr view "$url" --json state --jq .state)" = "MERGED" ]; then
              echo "Fusionnee : $url" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 30
          done
          echo "::error::$url n'est pas fusionnee apres 20 min : controle rouge, ou execution en attente d'approbation (action_required) dans l'onglet Actions."
          exit 1
