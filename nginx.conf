# Reprise fidele de la configuration posee a la main dans le conteneur le
# 04/08/2026, plus les trois manques mesures en production le 16/08.
# Toute modification passe desormais par un commit, plus par un shell root.

server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Une adresse sans barre finale (/tools/seoplus/securite/spf-dkim-dmarc)
    # declenche une redirection de nginx vers la version avec barre. Sans cette
    # ligne il la construit en absolu, donc en http:// et sur le nom d'hote
    # interne du conteneur, ce qui sort du site. En relatif, le proxy garde la
    # main sur le schema et l'hote.
    absolute_redirect off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()" always;
    # Clarity (couche 3, sous consentement) : la balise www.clarity.ms/tag/<id>
    # n'est qu'une amorce. La chaine reelle est
    # www.clarity.ms -> scripts.clarity.ms -> <region>.clarity.ms/collect,
    # soit trois sous-domaines, d'ou le joker en script-src ET connect-src.
    # Une CSP incomplete ne fait pas echouer le traceur, ELLE LE REND MUET :
    # le tag s'insere, la collecte est bloquee, le tableau de bord reste vide.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://*.clarity.ms; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://n8n.romainben.cloud https://pudsotzpdmwrlgoevxqg.supabase.co https://*.clarity.ms https://c.bing.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self' https://n8n.romainben.cloud; object-src 'none'; upgrade-insecure-requests" always;

    gzip on;
    gzip_types text/html text/plain text/css text/xml application/javascript application/json application/xml application/rss+xml image/svg+xml;
    gzip_min_length 256;

    # Racine du conteneur = ce que sert l'ancien hote seoplus.optimizia.xyz :
    # 98 redirections vers la nouvelle adresse, et rien d'autre.
    location / {
    }

    # Le site lui-meme. Sa page d'erreur est la sienne : jusqu'au 16/08 le
    # fichier 404.html existait sans etre branche nulle part, une adresse
    # inconnue rendait la page grise de nginx.
    location /tools/seoplus/ {
        error_page 404 /tools/seoplus/404.html;
        # Repete ici volontairement : nginx n'herite les error_page du bloc
        # parent QUE si le bloc courant n'en declare aucune. La ligne du bloc
        # server ne s'appliquerait donc pas dans cette location, qui est
        # justement celle ou tombent /en/ et les autres repertoires.
        error_page 403 =404 /tools/seoplus/404.html;
    }

    # Un repertoire sans index.html (/en/, /assets/, /assets/img/) repondait 403
    # nu : nginx refuse le listing. Un 403 se lit comme un blocage d'acces dans
    # la Search Console, la ou un 404 se lit comme une page absente, ce qui est
    # la verite. On rend donc la page d'erreur du site, avec le bon statut.
    error_page 403 =404 /tools/seoplus/404.html;

    # ------------------------------------------------------------------
    # Restructuration du 29/08/2026, second temps : le blog est dissous dans
    # les silos de contenu du domaine (/seo/ et /geo/, servis par le
    # conteneur agence), et les pages de l'outil prennent des noms anglais.
    # Les deux guides conserves partent vers LEUR nouvelle adresse exacte ;
    # tout le reste du blog part vers le pilier de son theme. Un exact match
    # (=) passe toujours avant un prefixe (^~), l'ordre d'ecriture est donc
    # sans importance pour les survivants.
    # ------------------------------------------------------------------
    # les deux guides conserves, quatre formes chacun (FR/EN, avec/sans barre)
    location = /tools/seoplus/autorite-confiance/audit-seo-exemple/ { return 301 /seo/seo-audit-example/$is_args$args; }
    location = /tools/seoplus/autorite-confiance/audit-seo-exemple { return 301 /seo/seo-audit-example/$is_args$args; }
    location = /tools/seoplus/en/authority-trust/seo-audit-example/ { return 301 /seo/seo-audit-example/$is_args$args; }
    location = /tools/seoplus/en/authority-trust/seo-audit-example { return 301 /seo/seo-audit-example/$is_args$args; }
    location = /tools/seoplus/visibilite-ia/chatgpt-connait-pas-votre-marque/ { return 301 /geo/chatgpt-doesnt-know-your-brand/$is_args$args; }
    location = /tools/seoplus/visibilite-ia/chatgpt-connait-pas-votre-marque { return 301 /geo/chatgpt-doesnt-know-your-brand/$is_args$args; }
    location = /tools/seoplus/en/ai-visibility/chatgpt-doesnt-know-your-brand/ { return 301 /geo/chatgpt-doesnt-know-your-brand/$is_args$args; }
    location = /tools/seoplus/en/ai-visibility/chatgpt-doesnt-know-your-brand { return 301 /geo/chatgpt-doesnt-know-your-brand/$is_args$args; }
    # les anciens silos, par theme : la visibilite IA part sur /geo/, le reste sur /seo/
    location ^~ /tools/seoplus/visibilite-ia/ { return 301 /geo/; }
    location = /tools/seoplus/visibilite-ia { return 301 /geo/; }
    location ^~ /tools/seoplus/en/ai-visibility/ { return 301 /geo/; }
    location ^~ /tools/seoplus/autorite-confiance/ { return 301 /seo/; }
    location = /tools/seoplus/autorite-confiance { return 301 /seo/; }
    location ^~ /tools/seoplus/conformite/ { return 301 /seo/; }
    location = /tools/seoplus/conformite { return 301 /seo/; }
    location ^~ /tools/seoplus/contenu-seo/ { return 301 /seo/; }
    location = /tools/seoplus/contenu-seo { return 301 /seo/; }
    location ^~ /tools/seoplus/referencement-local/ { return 301 /seo/; }
    location = /tools/seoplus/referencement-local { return 301 /seo/; }
    location ^~ /tools/seoplus/securite/ { return 301 /seo/; }
    location = /tools/seoplus/securite { return 301 /seo/; }
    location ^~ /tools/seoplus/seo-technique/ { return 301 /seo/; }
    location = /tools/seoplus/seo-technique { return 301 /seo/; }
    location ^~ /tools/seoplus/blog/ { return 301 /seo/; }
    location = /tools/seoplus/blog { return 301 /seo/; }
    # tout /en/ restant (listing, autres silos anglais) : contenu -> /seo/, racine -> l'outil
    location = /tools/seoplus/en/ { return 301 /tools/seoplus/; }
    location = /tools/seoplus/en { return 301 /tools/seoplus/; }
    location ^~ /tools/seoplus/en/ { return 301 /seo/; }
    # les 80 stubs plats blog-*.html n'ont jamais ete indexes ici (noindex) :
    # une seule regle generique suffit, apres les exacts des deux survivants
    location = /tools/seoplus/blog-audit-seo-exemple.html { return 301 /seo/seo-audit-example/$is_args$args; }
    location = /tools/seoplus/blog-en-seo-audit-example.html { return 301 /seo/seo-audit-example/$is_args$args; }
    location = /tools/seoplus/blog-chatgpt-connait-pas-votre-marque.html { return 301 /geo/chatgpt-doesnt-know-your-brand/$is_args$args; }
    location = /tools/seoplus/blog-en-chatgpt-doesnt-know-your-brand.html { return 301 /geo/chatgpt-doesnt-know-your-brand/$is_args$args; }
    location ~ ^/tools/seoplus/blog-en-(ai|geo|llms|chatgpt)[a-z0-9-]*\.html$ { return 301 /geo/; }
    location ~ ^/tools/seoplus/blog[a-z0-9-]*\.html$ { return 301 /seo/; }
    # les pages de l'outil prennent des noms anglais (29/08)
    location = /tools/seoplus/compte.html { return 301 /tools/seoplus/account.html$is_args$args; }
    location = /tools/seoplus/classement.html { return 301 /tools/seoplus/leaderboard.html$is_args$args; }
    location = /tools/seoplus/bilan.html { return 301 /tools/seoplus/snapshot.html$is_args$args; }
    location = /tools/seoplus/rapport.html { return 301 /tools/seoplus/report.html$is_args$args; }
    location = /tools/seoplus/roast.html { return 301 /tools/seoplus/snapshot.html$is_args$args; }
    location = /tools/seoplus/methodologie.html { return 301 /tools/seoplus/methodology.html$is_args$args; }
    location = /tools/seoplus/generateur-llms-txt.html { return 301 /tools/seoplus/llms-txt-generator.html$is_args$args; }
    location = /tools/seoplus/a-propos.html { return 301 /about.html; }
    # le flux RSS decrivait le blog : il suit le blog
    location = /tools/seoplus/feed.xml { return 301 /seo/; }
    location = /tools/seoplus/feed-en.xml { return 301 /seo/; }
    location = /tools/seoplus/llms-full.txt { return 301 /tools/seoplus/llms.txt; }


    # Le site a vecu quelques heures sous /outils/seo-plus/ le 16/08 avant
    # d'etre renomme, en deux temps, en /tools/seoplus/. La route Caddy des
    # anciens prefixes arrive ici, et c'est nginx qui recolle : sans ces
    # regles, toute adresse crawlee pendant cette fenetre repondrait 404. Le
    # rewrite garde le chemin complet, la redirection est relative grace a
    # absolute_redirect off. /outils/seoplus/ n'a jamais repondu en public
    # mais la regle ne coute rien.
    location ^~ /outils/seo-plus/ {
        rewrite ^/outils/seo-plus/(.*)$ /tools/seoplus/$1 permanent;
    }
    location ^~ /outils/seoplus/ {
        rewrite ^/outils/seoplus/(.*)$ /tools/seoplus/$1 permanent;
    }
    location = /outils/seo-plus { return 301 /tools/seoplus/; }
    location = /outils/seoplus  { return 301 /tools/seoplus/; }

    # Cache long reserve a assets/ : tout ce qui y est appele porte un ?v= dans
    # le HTML (style.css, app.js, i18n-en.js en ?v=20260817), les polices et
    # images ne changent pas.
    # config.js reste volontairement dehors : il n'est PAS versionne et il
    # porte les URLs de webhook n8n et les cles Supabase. Un cache long dessus
    # servirait un ancien webhook pendant trente jours apres sa correction.
    location ^~ /tools/seoplus/assets/ {
        expires 30d;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
