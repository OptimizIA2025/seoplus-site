# Reprise fidele de la configuration posee a la main dans le conteneur le
# 04/08/2026, plus les trois manques mesures en production le 16/08.
# Toute modification passe desormais par un commit, plus par un shell root.

server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Une adresse sans barre finale (/outils/seoplus/securite/spf-dkim-dmarc)
    # declenche une redirection de nginx vers la version avec barre. Sans cette
    # ligne il la construit en absolu, donc en http:// et sur le nom d'hote
    # interne du conteneur, ce qui sort du site. En relatif, le proxy garde la
    # main sur le schema et l'hote.
    absolute_redirect off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://n8n.romainben.cloud https://pudsotzpdmwrlgoevxqg.supabase.co; frame-ancestors 'self'; base-uri 'self'; form-action 'self' https://n8n.romainben.cloud; object-src 'none'; upgrade-insecure-requests" always;

    gzip on;
    gzip_types text/html text/plain text/css text/xml application/javascript application/json application/xml application/rss+xml image/svg+xml;
    gzip_min_length 256;

    # Racine du conteneur = ce que sert l'ancien hote seoplus.optimizia.xyz :
    # 98 redirections vers la nouvelle adresse, et rien d'autre.
    location / {
    }

    # Le site lui-meme. Sa page d'erreur est la sienne : jusqu'au 16/08 le
    # fichier 404.html existait sans etre branche nulle part, une adresse
    # inconnue rendait la page grise de nginx.
    location /outils/seoplus/ {
        error_page 404 /outils/seoplus/404.html;
    }

    # Le site a vecu quelques heures le 17/08 sous /outils/seo-plus/ avant
    # d'etre renomme en /outils/seoplus/. La route Caddy des deux prefixes
    # arrive ici, et c'est nginx qui recolle : sans cette regle, toute adresse
    # crawlee pendant cette fenetre repondrait 404. Le rewrite garde le chemin
    # complet, la redirection est relative grace a absolute_redirect off.
    location ^~ /outils/seo-plus/ {
        rewrite ^/outils/seo-plus/(.*)$ /outils/seoplus/$1 permanent;
    }

    # Cache long reserve a assets/ : tout ce qui y est appele porte un ?v= dans
    # le HTML (style.css, app.js, i18n-en.js en ?v=20260817), les polices et
    # images ne changent pas.
    # config.js reste volontairement dehors : il n'est PAS versionne et il
    # porte les URLs de webhook n8n et les cles Supabase. Un cache long dessus
    # servirait un ancien webhook pendant trente jours apres sa correction.
    location ^~ /outils/seoplus/assets/ {
        expires 30d;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
