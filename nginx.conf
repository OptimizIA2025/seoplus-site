    # Le site a vecu quelques heures sous /outils/seo-plus/ le 16/08 avant
    # d'etre renomme, en deux temps, en /tools/seoplus/. La route Caddy des
    # anciens prefixes arrive ici, et c'est nginx qui recolle : sans ces
    # regles, toute adresse crawlee pendant cette fenetre repondrait 404. Le
    # rewrite garde le chemin complet, la redirection est relative grace a
    # absolute_redirect off. /outils/seoplus/ n'a jamais repondu en public
    # mais la regle ne coute rien.
    location ^~ /outils/seo-plus/ {
        rewrite ^/outils/seo-plus/(.*)$ /tools/seoplus/$1 permanent;
    }
    location ^~ /outils/seoplus/ {
        rewrite ^/outils/seoplus/(.*)$ /tools/seoplus/$1 permanent;
    }
    location = /outils/seo-plus { return 301 /tools/seoplus/; }
    location = /outils/seoplus  { return 301 /tools/seoplus/; }

    # Cache long reserve a assets/ : tout ce qui y est appele porte un ?v= dans
    # le HTML (style.css, app.js, i18n-en.js en ?v=20260817), les polices et
    # images ne changent pas.
    # config.js reste volontairement dehors : il n'est PAS versionne et il
    # porte les URLs de webhook n8n et les cles Supabase. Un cache long dessus
    # servirait un ancien webhook pendant trente jours apres sa correction.
    location ^~ /tools/seoplus/assets/ {
        expires 30d;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
