# Reprise fidele de la configuration posee a la main dans le conteneur le
# 04/08/2026, plus les trois manques mesures en production le 16/08.
# Toute modification passe desormais par un commit, plus par un shell root.

server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Une adresse sans barre finale (/tools/seoplus/securite/spf-dkim-dmarc)
    # declenche une redirection de nginx vers la version avec barre. Sans cette
    # ligne il la construit en absolu, donc en http:// et sur le nom d'hote
    # interne du conteneur, ce qui sort du site. En relatif, le proxy garde la
    # main sur le schema et l'hote.
    absolute_redirect off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()" always;
    # Clarity (couche 3, sous consentement) : la balise www.clarity.ms/tag/<id>
    # n'est qu'une amorce. La chaine reelle est
    # www.clarity.ms -> scripts.clarity.ms -> <region>.clarity.ms/collect,
    # soit trois sous-domaines, d'ou le joker en script-src ET connect-src.
    # Une CSP incomplete ne fait pas echouer le traceur, ELLE LE REND MUET :
    # le tag s'insere, la collecte est bloquee, le tableau de bord reste vide.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://*.clarity.ms; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://n8n.romainben.cloud https://pudsotzpdmwrlgoevxqg.supabase.co https://*.clarity.ms https://c.bing.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self' https://n8n.romainben.cloud; object-src 'none'; upgrade-insecure-requests" always;

    gzip on;
    gzip_types text/html text/plain text/css text/xml application/javascript application/json application/xml application/rss+xml image/svg+xml;
    gzip_min_length 256;

    # Racine du conteneur = ce que sert l'ancien hote seoplus.optimizia.xyz :
    # 98 redirections vers la nouvelle adresse, et rien d'autre.
    location / {
    }

    # Le site lui-meme. Sa page d'erreur est la sienne : jusqu'au 16/08 le
    # fichier 404.html existait sans etre branche nulle part, une adresse
    # inconnue rendait la page grise de nginx.
    location /tools/seoplus/ {
        error_page 404 /tools/seoplus/404.html;
        # Repete ici volontairement : nginx n'herite les error_page du bloc
        # parent QUE si le bloc courant n'en declare aucune. La ligne du bloc
        # server ne s'appliquerait donc pas dans cette location, qui est
        # justement celle ou tombent /en/ et les autres repertoires.
        error_page 403 =404 /tools/seoplus/404.html;
    }

    # Un repertoire sans index.html (/en/, /assets/, /assets/img/) repondait 403
    # nu : nginx refuse le listing. Un 403 se lit comme un blocage d'acces dans
    # la Search Console, la ou un 404 se lit comme une page absente, ce qui est
    # la verite. On rend donc la page d'erreur du site, avec le bon statut.
    error_page 403 =404 /tools/seoplus/404.html;

    # /en/ n'a pas de page a lui : les guides vivent dessous, l'accueil est a
    # la racine du site. Depuis le 29/08 cet accueil EST anglais, le parametre
    # ?lang=en n'existe plus et le pointer ici renverrait vers une adresse que
    # rien ne sert.
    location = /tools/seoplus/en/ { return 301 /tools/seoplus/; }
    location = /tools/seoplus/en  { return 301 /tools/seoplus/; }

    # Le flux anglais s'appelait feed-en.xml tant qu'il y en avait deux. Il n'en
    # reste qu'un, qui reprend le nom canonique. L'ancienne adresse etait
    # declaree en <link rel="alternate"> sur 40 pages : un lecteur RSS deja
    # abonne cesserait de recevoir quoi que ce soit sans cette ligne.
    location = /tools/seoplus/feed-en.xml { return 301 /tools/seoplus/feed.xml; }

    # ------------------------------------------------------------------
    # Le silo editorial francais a ete retire le 29/08/2026 : le site est
    # ecrit en anglais seul. Chaque adresse francaise part en 301 vers SA
    # traduction, jamais vers la page d accueil du blog : une redirection
    # vers un equivalent exact transmet le signal, une redirection vers
    # une page generique est traitee comme un 404 deguise.
    # Les deux formes sont declarees, avec et sans barre finale : le
    # repertoire n existe plus, donc nginx ne peut plus ajouter la barre
    # lui-meme et la forme nue tomberait en 404.
    # ------------------------------------------------------------------
