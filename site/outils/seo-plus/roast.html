  <!-- Cette page a ete renommee bilan.html. Elle ne reste ici que pour les liens
       deja partages et les onglets ouverts : la redirection recopie la chaine de
       requete, sans quoi l'URL analysee serait perdue en route. Une vraie 301

    (function () {
      var q = window.location.search || "";
      var h = window.location.hash || "";
      window.location.replace("bilan.html" + q + h);
    })();
  </script>

</head>
